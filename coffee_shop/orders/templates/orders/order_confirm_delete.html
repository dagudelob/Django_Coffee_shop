{% extends 'products/base.html' %}

{% block content %}
<!-- Tailwind CSS via CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    coffee: {
                        light: '#8E735B',
                        medium: '#4A3320',
                        dark: '#2C1E16',
                    },
                    accent: '#D4A373',
                    cream: '#F5F0EA',
                }
            }
        }
    }
</script>

<div class="container mx-auto px-4 py-12 max-w-lg">
    <div class="bg-white rounded-[2rem] shadow-2xl border border-gray-100 overflow-hidden text-center p-8">
        <!-- Warning Icon -->
        <div class="w-20 h-20 bg-red-50 text-red-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-6 shadow-inner animate-pulse">
            ⚠️
        </div>
        
        <h1 class="text-3xl font-extrabold text-coffee-dark mb-4">¿Eliminar Pedido?</h1>
        
        <p class="text-gray-500 mb-8">
            ¿Estás seguro de que deseas eliminar permanentemente el <strong>Pedido #{{ order.id }}</strong>? 
            Esta acción no se puede deshacer.
        </p>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <button type="submit" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3.5 px-6 rounded-full shadow-lg transition-all duration-300">
                Sí, Eliminar Pedido 🗑️
            </button>
            <a href="{% url 'orders:list' %}" class="w-full block bg-cream hover:bg-coffee-light/10 text-coffee-dark font-bold py-3.5 px-6 rounded-full border border-gray-200 transition-all duration-300">
                Cancelar
            </a>
        </form>
    </div>
</div>
{% endblock %}
